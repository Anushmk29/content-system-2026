# Self-hosted Postiz — the single publishing rail (Bible §12.1)
# One scheduler for all platforms: handles tokens, scheduling, retries, publishing UI.
# Run:  cp .env.example .env  (fill values)  &&  docker compose up -d
# Then open MAIN_URL (local: http://localhost:5000), register, connect LinkedIn + X,
# and create an API key under Settings → Public API.
#
# Postiz schedules via Temporal (required since v2). Temporal's own Postgres is local and
# internal-only; Postiz's data lives in Supabase (`postiz` schema).
# Elasticsearch is required: SQL-only visibility caps Text search attributes at 3 and
# Postiz registers more (backend crashes on boot without it).
# ponytail: no Temporal UI/admin-tools; add from gitroomhq/postiz-docker-compose if debugging workflows.

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    environment:
      # --- URLs (local: http://localhost:5000; VPS: your domain behind a reverse proxy) ---
      MAIN_URL: "${MAIN_URL}"
      FRONTEND_URL: "${MAIN_URL}"
      NEXT_PUBLIC_BACKEND_URL: "${MAIN_URL}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: "${JWT_SECRET}"
      # Supabase (no local Postgres). Its own `postiz` schema keeps it apart from `content`.
      DATABASE_URL: "${POSTIZ_DATABASE_URL}"
      REDIS_URL: "redis://postiz-redis:6379"
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: "true"
      RUN_CRON: "true"
      DISABLE_REGISTRATION: "${DISABLE_REGISTRATION:-false}"  # set true after you create your account
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      # --- Social apps (fill as you connect each platform) ---
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      X_API_KEY: "${X_API_KEY:-}"
      X_API_SECRET: "${X_API_SECRET:-}"
      # One Meta app covers both Facebook pages and Instagram (business account linked to a page)
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "5000:5000"
    depends_on:
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    restart: unless-stopped
    volumes:
      - postiz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal-postgresql:
    image: postgres:16-alpine
    container_name: temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    volumes:
      - temporal-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      TEMPORAL_NAMESPACE: default
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postiz-config:
  postiz-uploads:
  postiz-redis:
  temporal-postgres:
  temporal-elasticsearch:
